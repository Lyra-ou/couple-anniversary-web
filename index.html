<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Distance - NASA Blue Marble Earth</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-1: #020713;
      --bg-2: #071b2d;
      --bg-3: #0b1830;
      --text: #edf6ff;
      --distance: #f2f8ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(67, 92, 140, 0.22), transparent 20%),
        radial-gradient(circle at 70% 15%, rgba(98, 130, 184, 0.18), transparent 16%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2) 34%, var(--bg-3));
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.04em;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 18%, rgba(255,255,255,0.9) 0 1px, transparent 2px),
        radial-gradient(circle at 30% 62%, rgba(255,255,255,0.7) 0 1.2px, transparent 2.5px),
        radial-gradient(circle at 56% 28%, rgba(255,255,255,0.75) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 74%, rgba(255,255,255,0.8) 0 1.3px, transparent 2.8px),
        radial-gradient(circle at 85% 34%, rgba(255,255,255,0.8) 0 1px, transparent 2px),
        radial-gradient(circle at 90% 72%, rgba(255,255,255,0.8) 0 1.1px, transparent 2.3px);
      opacity: 0.85;
      z-index: 1;
    }

    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .page {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .page.active {
      opacity: 1;
      pointer-events: auto;
    }

    .page-1 {
      z-index: 100;
    }

    .page-2 {
      z-index: 99;
    }

    .orbit-hint {
      position: absolute;
      left: 50%;
      bottom: 14%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: rgba(210, 225, 255, 0.52);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      user-select: none;
      animation: pulse 2.8s ease-in-out infinite;
    }

    .marker {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.9s ease, transform 0.9s ease;
      pointer-events: none;
      z-index: 15;
    }

    .marker.visible {
      opacity: 1;
      transform: scale(1);
    }

    .marker.china {
      background: #8de9ff;
      box-shadow: 0 0 0 2px rgba(133, 233, 255, 0.15), 0 0 26px rgba(133, 233, 255, 0.9);
    }

    .marker.uk {
      background: #dfe9ff;
      box-shadow: 0 0 0 2px rgba(223, 233, 255, 0.15), 0 0 26px rgba(223, 233, 255, 0.78);
    }

    .city {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transform: translateY(12px) scale(0.94);
      transition: opacity 1s ease, transform 1s ease, filter 1s ease;
      filter: blur(8px);
      text-transform: uppercase;
      pointer-events: none;
      z-index: 14;
    }

    .city.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .city .name {
      font-size: clamp(0.72rem, 1vw, 1.2rem);
      font-weight: 600;
      letter-spacing: 0.18em;
      text-shadow: 0 0 18px rgba(140,208,255,0.72);
    }

    .city .country {
      font-size: clamp(0.55rem, 0.8vw, 0.8rem);
      letter-spacing: 0.24em;
      color: rgba(214, 228, 255, 0.72);
    }

    .distance-box {
      position: absolute;
      left: 50%;
      bottom: 16%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      transition: opacity 0.8s ease, transform 0.8s ease;
      text-align: center;
      pointer-events: none;
      z-index: 16;
    }

    .distance-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .distance-box .label {
      font-size: clamp(0.72rem, 1vw, 1.1rem);
      letter-spacing: 0.18em;
      color: rgba(226, 235, 255, 0.8);
    }

    .distance-box .value {
      margin-top: 0.5rem;
      font-size: clamp(2rem, 3vw, 3.6rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--distance);
      text-shadow: 0 0 30px rgba(169, 213, 255, 0.5);
      line-height: 1.1;
    }

    .distance-box .unit {
      margin-top: 0.3rem;
      font-size: clamp(0.7rem, 0.8vw, 0.95rem);
      letter-spacing: 0.14em;
      color: rgba(212, 226, 255, 0.75);
    }

    .route-line {
      position: absolute;
      stroke: rgba(132, 203, 255, 0.75);
      fill: none;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(132, 203, 255, 0.8));
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      opacity: 0;
      transition: stroke-dashoffset 2.6s ease, opacity 0.6s ease;
      pointer-events: none;
      z-index: 13;
    }

    .route-line.visible {
      opacity: 1;
      stroke-dashoffset: 0;
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(220, 235, 255, 0.6);
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .loading.show {
      opacity: 1;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.9; transform: translateX(-50%) scale(1.04); }
    }

    @media (max-width: 700px) {
      .city .name { letter-spacing: 0.11em; }
      .city .country { letter-spacing: 0.14em; }
      .distance-box .label { letter-spacing: 0.12em; }
    }
  </style>
</head>
<body>
  <div class="loading show" id="loading">Loading NASA Blue Marble...</div>
  <canvas id="canvas"></canvas>

  <div class="ui-overlay">
    <div class="page page-1 active" id="page1">
      <div class="orbit-hint">Click the Earth</div>
    </div>

    <div class="page page-2" id="page2">
      <div class="marker china" id="chinaMarker"></div>
      <div class="marker uk" id="ukMarker"></div>

      <div class="city" id="chinaCity">
        <div class="name">Hangzhou</div>
        <div class="country">China</div>
      </div>

      <div class="city" id="ukCity">
        <div class="name">Reading</div>
        <div class="country">United Kingdom</div>
      </div>

      <svg id="routeSvg" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;">
        <polyline id="routeLine" class="route-line" stroke-width="2" />
      </svg>

      <div class="distance-box" id="distanceBox">
        <div class="label">我们的距离:</div>
        <div class="value" id="distanceValue">0</div>
        <div class="unit">公里</div>
      </div>
    </div>
  </div>

  <script>
    // Scene setup
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000, 0);

    camera.position.z = 2.5;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
    sunLight.position.set(2, 1.5, 1.5);
    scene.add(sunLight);

    // Glow effect layer
    const canvas2dGlow = document.createElement('canvas');
    canvas2dGlow.width = 128;
    canvas2dGlow.height = 128;
    const ctxGlow = canvas2dGlow.getContext('2d');
    const gradGlow = ctxGlow.createRadialGradient(64, 64, 0, 64, 64, 90);
    gradGlow.addColorStop(0, 'rgba(100, 200, 255, 0.4)');
    gradGlow.addColorStop(0.5, 'rgba(100, 200, 255, 0.1)');
    gradGlow.addColorStop(1, 'rgba(100, 200, 255, 0)');
    ctxGlow.fillStyle = gradGlow;
    ctxGlow.fillRect(0, 0, 128, 128);

    // Coordinates
    const HANGZHOU = { lat: 30.2741, lon: 120.1551 }; // 杭州
    const READING = { lat: 51.4545, lon: -0.9796 };   // 雷丁

    function latLonToVector3(lat, lon, radius = 1) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      return new THREE.Vector3(x, y, z);
    }

    function vector3ToScreen(vec3) {
      const pos = vec3.clone().project(camera);
      const width = window.innerWidth;
      const height = window.innerHeight;
      return {
        x: (pos.x * width) / 2 + width / 2,
        y: -(pos.y * height) / 2 + height / 2
      };
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // UI elements
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const chinaMarker = document.getElementById('chinaMarker');
    const ukMarker = document.getElementById('ukMarker');
    const chinaCity = document.getElementById('chinaCity');
    const ukCity = document.getElementById('ukCity');
    const distanceBox = document.getElementById('distanceBox');
    const distanceValue = document.getElementById('distanceValue');
    const routeLine = document.getElementById('routeLine');
    const routeSvg = document.getElementById('routeSvg');
    const loadingEl = document.getElementById('loading');

    let transitionLocked = false;
    let rotationVelocity = 0.0003;
    let isRotating = true;
    let earthMesh = null;

    // Load NASA Blue Marble texture
    const textureLoader = new THREE.TextureLoader();
    textureLoader.load(
      'https://www.nasaspaceflight.com/wp-content/uploads/2013/10/earth_lights_lrg.jpg',
      function (texture) {
        createEarth(texture);
      },
      undefined,
      function (err) {
        console.warn('Failed to load primary texture, using fallback', err);
        // Fallback to a different URL
        textureLoader.load(
          'https://eoimages.gsfc.nasa.gov/images/imagerecords/73000/73776/GEBCO_NOAA_8bit_elevation_tidemarked_geo.tif',
          function (texture) {
            createEarth(texture);
          },
          undefined,
          function (err2) {
            console.warn('Fallback also failed, creating procedural Earth');
            createProceduralEarth();
          }
        );
      }
    );

    function createEarth(texture) {
      const geometry = new THREE.SphereGeometry(1, 512, 512);
      
      const material = new THREE.MeshPhongMaterial({
        map: texture,
        shininess: 3,
        emissive: 0x1a1a1a,
      });

      earthMesh = new THREE.Mesh(geometry, material);
      scene.add(earthMesh);

      // Atmosphere glow
      const atmosphereGeometry = new THREE.SphereGeometry(1.05, 256, 256);
      const atmosphereMaterial = new THREE.MeshBasicMaterial({
        color: 0x87ceeb,
        transparent: true,
        opacity: 0.15,
        side: THREE.BackSide,
      });
      const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
      scene.add(atmosphere);

      // Outer glow
      const glowGeometry = new THREE.SphereGeometry(1.08, 128, 128);
      const glowTexture = new THREE.CanvasTexture(canvas2dGlow);
      const glowMaterial = new THREE.MeshBasicMaterial({
        map: glowTexture,
        transparent: true,
        side: THREE.BackSide,
      });
      const glow = new THREE.Mesh(glowGeometry, glowMaterial);
      scene.add(glow);

      loadingEl.classList.remove('show');
    }

    function createProceduralEarth() {
      const geometry = new THREE.SphereGeometry(1, 512, 512);
      
      // Create canvas texture (high quality procedural)
      const canvas2d = document.createElement('canvas');
      canvas2d.width = 2048;
      canvas2d.height = 1024;
      const ctx = canvas2d.getContext('2d');

      // Ocean
      const oceanGradient = ctx.createLinearGradient(0, 0, 0, canvas2d.height);
      oceanGradient.addColorStop(0, '#0d4a7a');
      oceanGradient.addColorStop(0.5, '#0a3a5a');
      oceanGradient.addColorStop(1, '#081f3a');
      ctx.fillStyle = oceanGradient;
      ctx.fillRect(0, 0, canvas2d.width, canvas2d.height);

      // Continents with detail
      const continentColor = '#1a5a3a';
      ctx.fillStyle = continentColor;

      // North America
      for (let i = 0; i < 400; i++) {
        const x = Math.random() * 350 + 150;
        const y = Math.random() * 280 + 180;
        const size = Math.random() * 30 + 3;
        ctx.fillRect(x, y, size, size);
      }

      // South America
      for (let i = 0; i < 250; i++) {
        const x = Math.random() * 200 + 250;
        const y = Math.random() * 350 + 400;
        const size = Math.random() * 25 + 2;
        ctx.fillRect(x, y, size, size);
      }

      // Europe & Africa
      for (let i = 0; i < 500; i++) {
        const x = Math.random() * 400 + 750;
        const y = Math.random() * 400 + 200;
        const size = Math.random() * 25 + 3;
        ctx.fillRect(x, y, size, size);
      }

      // Asia
      for (let i = 0; i < 600; i++) {
        const x = Math.random() * 600 + 1200;
        const y = Math.random() * 350 + 150;
        const size = Math.random() * 28 + 3;
        ctx.fillRect(x, y, size, size);
      }

      // Australia
      for (let i = 0; i < 150; i++) {
        const x = Math.random() * 150 + 1600;
        const y = Math.random() * 150 + 550;
        const size = Math.random() * 20 + 2;
        ctx.fillRect(x, y, size, size);
      }

      const texture = new THREE.CanvasTexture(canvas2d);
      texture.magFilter = THREE.LinearFilter;
      texture.minFilter = THREE.LinearMipmapLinearFilter;

      const material = new THREE.MeshPhongMaterial({
        map: texture,
        shininess: 5,
        emissive: 0x0a0a0a,
      });

      earthMesh = new THREE.Mesh(geometry, material);
      scene.add(earthMesh);

      // Atmosphere
      const atmosphereGeometry = new THREE.SphereGeometry(1.05, 256, 256);
      const atmosphereMaterial = new THREE.MeshBasicMaterial({
        color: 0x87ceeb,
        transparent: true,
        opacity: 0.18,
        side: THREE.BackSide,
      });
      const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
      scene.add(atmosphere);

      // Glow
      const glowGeometry = new THREE.SphereGeometry(1.08, 128, 128);
      const glowTexture = new THREE.CanvasTexture(canvas2dGlow);
      const glowMaterial = new THREE.MeshBasicMaterial({
        map: glowTexture,
        transparent: true,
        side: THREE.BackSide,
      });
      const glow = new THREE.Mesh(glowGeometry, glowMaterial);
      scene.add(glow);

      loadingEl.classList.remove('show');
    }

    // Mouse move tilt
    document.addEventListener('pointermove', (e) => {
      if (transitionLocked || !earthMesh) return;
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = (e.clientY / window.innerHeight) * 2 - 1;
      earthMesh.rotation.y = -x * 0.3;
      earthMesh.rotation.x = y * 0.2;
    });

    // Update marker positions
    function updateMarkers() {
      if (!earthMesh) return;

      const chinaPos = latLonToVector3(HANGZHOU.lat, HANGZHOU.lon);
      const readingPos = latLonToVector3(READING.lat, READING.lon);

      // Transform to world coordinates
      chinaPos.applyQuaternion(earthMesh.quaternion);
      readingPos.applyQuaternion(earthMesh.quaternion);

      const chinaScreen = vector3ToScreen(chinaPos);
      const readingScreen = vector3ToScreen(readingPos);

      chinaMarker.style.left = chinaScreen.x + 'px';
      chinaMarker.style.top = chinaScreen.y + 'px';
      chinaMarker.style.transform = 'translate(-50%, -50%)';

      ukMarker.style.left = readingScreen.x + 'px';
      ukMarker.style.top = readingScreen.y + 'px';
      ukMarker.style.transform = 'translate(-50%, -50%)';

      chinaCity.style.left = (chinaScreen.x - 60) + 'px';
      chinaCity.style.top = (chinaScreen.y + 50) + 'px';

      ukCity.style.left = (readingScreen.x + 60) + 'px';
      ukCity.style.top = (readingScreen.y - 60) + 'px';

      // Update route line
      const points = [chinaScreen.x, chinaScreen.y, readingScreen.x, readingScreen.y];
      routeLine.setAttribute('points', points.join(' '));
    }

    // Click to transition
    canvas.addEventListener('click', () => {
      if (transitionLocked || !earthMesh) return;
      transitionLocked = true;
      isRotating = false;

      // Smooth zoom camera
      let startZ = camera.position.z;
      let targetZ = 1.2;
      let progress = 0;

      function zoomCamera() {
        progress += 0.05;
        if (progress <= 1) {
          camera.position.z = startZ + (targetZ - startZ) * (1 - Math.pow(1 - progress, 3));
          requestAnimationFrame(zoomCamera);
        } else {
          camera.position.z = targetZ;
          showPage2();
        }
      }

      zoomCamera();
    });

    function showPage2() {
      page1.classList.remove('active');
      page2.classList.add('active');

      setTimeout(() => {
        chinaMarker.classList.add('visible');
        chinaCity.classList.add('visible');
      }, 2000);

      setTimeout(() => {
        ukMarker.classList.add('visible');
        ukCity.classList.add('visible');
      }, 4000);

      setTimeout(() => {
        routeLine.classList.add('visible');
      }, 6000);

      setTimeout(() => {
        distanceBox.classList.add('show');
        const distance = calculateDistance(HANGZHOU.lat, HANGZHOU.lon, READING.lat, READING.lon);
        animateDistance(distance);
      }, 8000);
    }

    function animateDistance(finalValue) {
      const start = 0;
      const startTime = performance.now();
      const duration = 2400;

      function draw(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        const current = start + (finalValue - start) * eased;
        distanceValue.textContent = current.toFixed(2);
        if (t < 1) requestAnimationFrame(draw);
      }

      requestAnimationFrame(draw);
    }

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      if (earthMesh && isRotating) {
        earthMesh.rotation.y += rotationVelocity;
      }

      if (earthMesh) {
        updateMarkers();
      }

      renderer.render(scene, camera);
    }

    // Handle window resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
