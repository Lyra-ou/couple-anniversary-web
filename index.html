<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Distance - Realistic 3D Earth</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-1: #010409;
      --bg-2: #05121f;
      --bg-3: #0a1a2e;
      --text: #e8f4ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 40%, var(--bg-3) 100%);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.95) 0 0.8px, transparent 1.6px),
        radial-gradient(circle at 25% 75%, rgba(255,255,255,0.8) 0 1px, transparent 2px),
        radial-gradient(circle at 38% 35%, rgba(255,255,255,0.85) 0 0.9px, transparent 1.8px),
        radial-gradient(circle at 55% 65%, rgba(255,255,255,0.75) 0 1.1px, transparent 2.2px),
        radial-gradient(circle at 72% 25%, rgba(255,255,255,0.82) 0 0.9px, transparent 1.8px),
        radial-gradient(circle at 88% 60%, rgba(255,255,255,0.78) 0 1px, transparent 2px),
        radial-gradient(circle at 92% 40%, rgba(255,255,255,0.8) 0 1.1px, transparent 2.1px),
        radial-gradient(circle at 18% 58%, rgba(255,255,255,0.72) 0 1px, transparent 2px);
      opacity: 0.85;
      filter: blur(0.1px);
    }

    #canvas {
      position: fixed;
      inset: 0;
      display: block;
      z-index: 0;
    }

    .page {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      z-index: 5;
    }

    .page.active {
      display: block;
      pointer-events: auto;
    }

    .page-1 {
      display: block;
    }

    .click-hint {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(210, 230, 255, 0.42);
      user-select: none;
      animation: pulse 3.2s ease-in-out infinite;
    }

    .marker {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.2);
      pointer-events: none;
      transition: opacity 0.85s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.85s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 15;
    }

    .marker.visible {
      opacity: 1;
      transform: scale(1);
    }

    .marker.china {
      background: #4dd9ff;
      box-shadow: 
        0 0 0 3px rgba(77, 217, 255, 0.15),
        0 0 24px rgba(77, 217, 255, 0.95),
        0 0 48px rgba(77, 217, 255, 0.6);
    }

    .marker.uk {
      background: #d5e5ff;
      box-shadow: 
        0 0 0 3px rgba(213, 229, 255, 0.15),
        0 0 24px rgba(213, 229, 255, 0.9),
        0 0 48px rgba(180, 210, 255, 0.5);
    }

    .city {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(16px) scale(0.9);
      transition: opacity 0.95s ease, transform 0.95s ease, filter 0.95s ease;
      filter: blur(12px);
      text-transform: uppercase;
      pointer-events: none;
      z-index: 14;
    }

    .city.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .city .name {
      font-size: clamp(0.75rem, 1.1vw, 1.25rem);
      letter-spacing: 0.2em;
      font-weight: 600;
      text-shadow: 0 0 20px rgba(120, 210, 255, 0.85);
    }

    .city .country {
      font-size: clamp(0.55rem, 0.8vw, 0.88rem);
      letter-spacing: 0.26em;
      color: rgba(200, 220, 255, 0.75);
      text-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
    }

    .route-line {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    .route-line svg {
      width: 100%;
      height: 100%;
    }

    .route-line polyline {
      fill: none;
      stroke: rgba(110, 200, 255, 0.75);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 900;
      stroke-dashoffset: 900;
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(110, 200, 255, 0.85));
      transition: stroke-dashoffset 3s cubic-bezier(0.42, 0, 0.58, 1), opacity 0.7s ease;
    }

    .route-line.visible polyline {
      opacity: 1;
      stroke-dashoffset: 0;
    }

    .route-particle {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b4e9ff;
      box-shadow: 
        0 0 0 1px rgba(180, 233, 255, 0.3),
        0 0 16px rgba(180, 233, 255, 1),
        0 0 32px rgba(180, 233, 255, 0.8),
        0 0 48px rgba(100, 200, 255, 0.4);
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      transform: translate(-50%, -50%);
    }

    .route-particle.visible {
      opacity: 1;
    }

    .distance-box {
      position: absolute;
      left: 50%;
      bottom: 14%;
      transform: translateX(-50%) translateY(30px);
      opacity: 0;
      transition: opacity 0.85s ease, transform 0.85s ease;
      text-align: center;
      pointer-events: none;
      z-index: 16;
    }

    .distance-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .distance-box .label {
      font-size: clamp(0.75rem, 1.05vw, 1.1rem);
      letter-spacing: 0.18em;
      color: rgba(220, 238, 255, 0.85);
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
    }

    .distance-box .value {
      margin-top: 0.6rem;
      font-size: clamp(2.4rem, 3.2vw, 4rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      color: #ecf6ff;
      text-shadow: 
        0 0 40px rgba(150, 220, 255, 0.65),
        0 0 80px rgba(100, 180, 255, 0.3),
        0 2px 16px rgba(0, 0, 0, 0.7);
      line-height: 1;
    }

    .distance-box .unit {
      margin-top: 0.4rem;
      font-size: clamp(0.7rem, 0.85vw, 1rem);
      letter-spacing: 0.15em;
      color: rgba(200, 220, 255, 0.75);
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.85; transform: translateX(-50%) scale(1.04); }
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(200, 230, 255, 0.65);
      font-size: 0.95rem;
      letter-spacing: 0.3em;
      z-index: 3;
      opacity: 0;
      transition: opacity 0.8s ease;
      text-transform: uppercase;
    }

    .loading.show {
      opacity: 1;
    }

    @media (max-width: 720px) {
      .click-hint { letter-spacing: 0.35em; font-size: 11px; }
      .city .name { letter-spacing: 0.15em; }
      .city .country { letter-spacing: 0.2em; }
    }
  </style>
</head>
<body>
  <div class="loading show" id="loading">Initializing Earth...</div>
  <canvas id="canvas"></canvas>

  <div class="page page-1 active" id="page1">
    <div class="click-hint">Click the Earth</div>
  </div>

  <div class="page page-2" id="page2">
    <div class="marker china" id="chinaMarker"></div>
    <div class="marker uk" id="ukMarker"></div>

    <div class="city" id="chinaCity">
      <div class="name">Hangzhou</div>
      <div class="country">China</div>
    </div>

    <div class="city" id="ukCity">
      <div class="name">Reading</div>
      <div class="country">United Kingdom</div>
    </div>

    <div class="route-line" id="routeLine">
      <svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
        <polyline id="routePolyline" points="200,420 500,280 800,260"></polyline>
      </svg>
    </div>

    <div class="route-particle" id="routeParticle"></div>

    <div class="distance-box" id="distanceBox">
      <div class="label">我们的距离</div>
      <div class="value" id="distanceValue">0</div>
      <div class="unit">公里</div>
    </div>
  </div>

  <script>
    // ========== Scene Setup ==========
    const canvas = document.getElementById('canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, precision: 'highp' });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    camera.position.set(0, 0, 2.8);

    // ========== Lighting ==========
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.42);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
    sunLight.position.set(2.5, 1.5, 2.2);
    sunLight.castShadow = true;
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0x5a8fd4, 0.25);
    rimLight.position.set(-2.2, 0.3, -1.8);
    scene.add(rimLight);

    // ========== Create Realistic Earth Texture ==========
    function createRealisticEarthTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 4096;
      canvas.height = 2048;
      const ctx = canvas.getContext('2d');

      // Deep ocean base with gradient
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#0f3d6b');
      grad.addColorStop(0.25, '#0d4578');
      grad.addColorStop(0.5, '#0a325d');
      grad.addColorStop(0.75, '#091c38');
      grad.addColorStop(1, '#050c18');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Add subtle water patterns
      ctx.strokeStyle = 'rgba(50, 120, 180, 0.08)';
      ctx.lineWidth = 0.3;
      for (let y = 0; y < canvas.height; y += 80) {
        ctx.beginPath();
        for (let x = 0; x < canvas.width; x += 40) {
          ctx.lineTo(x + Math.sin(y / 100) * 15, y + Math.cos(x / 100) * 10);
        }
        ctx.stroke();
      }

      // Realistic continent colors
      const landPalette = [
        { base: '#2d6e44', light: '#4a8f5e', shadow: '#1a4a2a' },
        { base: '#3a7a52', light: '#5fa878', shadow: '#1f5035' },
        { base: '#5a7f3a', light: '#7fa858', shadow: '#3a5520' },
        { base: '#8b7942', light: '#a89860', shadow: '#6b5922' },
        { base: '#6d5840', light: '#8a7558', shadow: '#4d3820' }
      ];

      function drawRealisticLandmass(x, y, width, height, palette, complexity) {
        for (let i = 0; i < complexity; i++) {
          const color = palette[Math.floor(Math.random() * palette.length)];
          const shade = Math.random();
          
          let fillColor;
          if (shade < 0.3) {
            fillColor = color.shadow;
          } else if (shade > 0.7) {
            fillColor = color.light;
          } else {
            fillColor = color.base;
          }
          
          ctx.fillStyle = fillColor;
          const px = x + Math.random() * width;
          const py = y + Math.random() * height;
          const size = Math.random() * 50 + 8;
          
          ctx.beginPath();
          ctx.ellipse(px, py, size * 1.2, size * 0.8, Math.random() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // North America
      drawRealisticLandmass(200, 220, 420, 280, landPalette, 800);

      // South America
      drawRealisticLandmass(320, 520, 200, 300, landPalette, 500);

      // Europe
      drawRealisticLandmass(850, 240, 220, 160, landPalette, 450);

      // Africa
      drawRealisticLandmass(950, 480, 300, 380, landPalette, 700);

      // Middle East & Asia Minor
      drawRealisticLandmass(1150, 380, 280, 240, landPalette, 550);

      // Central Asia
      drawRealisticLandmass(1280, 260, 320, 240, landPalette, 600);

      // East Asia
      drawRealisticLandmass(1600, 300, 380, 300, landPalette, 750);

      // Southeast Asia
      drawRealisticLandmass(1750, 500, 220, 180, landPalette, 400);

      // Australia
      drawRealisticLandmass(1800, 620, 180, 160, landPalette, 380);

      // Greenland
      drawRealisticLandmass(580, 100, 140, 160, landPalette, 300);

      // Antarctica
      ctx.fillStyle = '#2a5070';
      for (let i = 0; i < 400; i++) {
        ctx.fillRect(Math.random() * canvas.width, 920 + Math.random() * 128, Math.random() * 25 + 3, Math.random() * 20 + 2);
      }

      // Add cloud coverage simulation
      ctx.fillStyle = 'rgba(200, 220, 245, 0.15)';
      for (let i = 0; i < 300; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        const w = Math.random() * 80 + 20;
        const h = Math.random() * 40 + 10;
        ctx.fillRect(x, y, w, h);
      }

      // Atmospheric scattering effect
      ctx.fillStyle = 'rgba(100, 180, 255, 0.08)';
      for (let i = 0; i < 600; i++) {
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        ctx.fillRect(x, y, 3, 3);
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.magFilter = THREE.LinearFilter;
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      if (renderer.capabilities.getMaxAnisotropy) {
        texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 16);
      }
      return texture;
    }

    // ========== Create Earth ==========
    const earthGeometry = new THREE.IcosahedronGeometry(1.2, 128);
    const earthTexture = createRealisticEarthTexture();
    const earthMaterial = new THREE.MeshPhongMaterial({
      map: earthTexture,
      shininess: 6,
      emissive: 0x0d1620,
      emissiveMap: earthTexture,
      emissiveIntensity: 0.18,
      side: THREE.FrontSide,
    });

    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    earth.castShadow = true;
    earth.receiveShadow = true;
    earth.rotation.z = 0.2;
    scene.add(earth);

    // Atmosphere layers
    const atmos1Geo = new THREE.IcosahedronGeometry(1.228, 64);
    const atmos1Mat = new THREE.MeshBasicMaterial({
      color: 0x7fbdff,
      transparent: true,
      opacity: 0.22,
      side: THREE.BackSide,
    });
    const atmos1 = new THREE.Mesh(atmos1Geo, atmos1Mat);
    scene.add(atmos1);

    const atmos2Geo = new THREE.IcosahedronGeometry(1.32, 64);
    const atmos2Mat = new THREE.MeshBasicMaterial({
      color: 0x5a9fd4,
      transparent: true,
      opacity: 0.08,
      side: THREE.BackSide,
    });
    const atmos2 = new THREE.Mesh(atmos2Geo, atmos2Mat);
    scene.add(atmos2);

    // Outer glow
    const glowGeo = new THREE.IcosahedronGeometry(1.4, 64);
    const glowMat = new THREE.MeshBasicMaterial({
      color: 0x7fbdff,
      transparent: true,
      opacity: 0.06,
      side: THREE.BackSide,
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    scene.add(glow);

    // ========== Coordinate Utils ==========
    const HANGZHOU = { lat: 30.2741, lon: 120.1551 };
    const READING = { lat: 51.4545, lon: -0.9796 };

    function latLonToVec3(lat, lon, radius = 1.2) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      return new THREE.Vector3(x, y, z);
    }

    function vec3ToScreen(v) {
      const p = v.clone().project(camera);
      return {
        x: (p.x * window.innerWidth) / 2 + window.innerWidth / 2,
        y: -(p.y * window.innerHeight) / 2 + window.innerHeight / 2,
      };
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // ========== UI Elements ==========
    const chinaMarker = document.getElementById('chinaMarker');
    const ukMarker = document.getElementById('ukMarker');
    const chinaCity = document.getElementById('chinaCity');
    const ukCity = document.getElementById('ukCity');
    const routePolyline = document.getElementById('routePolyline');
    const routeParticle = document.getElementById('routeParticle');
    const distanceBox = document.getElementById('distanceBox');
    const distanceValue = document.getElementById('distanceValue');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const loading = document.getElementById('loading');

    let transitionLocked = false;
    let isRotating = true;
    let targetRotX = 0;
    let targetRotY = 0;
    let curRotX = 0;
    let curRotY = 0;

    // ========== Interaction ==========
    document.addEventListener('pointermove', (e) => {
      if (transitionLocked) return;
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = (e.clientY / window.innerHeight) * 2 - 1;
      targetRotY = -x * 0.3;
      targetRotX = y * 0.2;
    });

    function updateMarkers() {
      const china = latLonToVec3(HANGZHOU.lat, HANGZHOU.lon).applyQuaternion(earth.quaternion);
      const uk = latLonToVec3(READING.lat, READING.lon).applyQuaternion(earth.quaternion);
      const cPos = vec3ToScreen(china);
      const uPos = vec3ToScreen(uk);

      chinaMarker.style.left = cPos.x + 'px';
      chinaMarker.style.top = cPos.y + 'px';

      ukMarker.style.left = uPos.x + 'px';
      ukMarker.style.top = uPos.y + 'px';

      chinaCity.style.left = (cPos.x - 70) + 'px';
      chinaCity.style.top = (cPos.y + 60) + 'px';

      ukCity.style.left = (uPos.x + 70) + 'px';
      ukCity.style.top = (uPos.y - 70) + 'px';

      routePolyline.setAttribute('points', `${cPos.x},${cPos.y} ${window.innerWidth / 2},${window.innerHeight / 2 - 40} ${uPos.x},${uPos.y}`);
    }

    function animateDistance(value) {
      const start = 0;
      const startTime = performance.now();
      const duration = 2400;

      function tick(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        const current = start + (value - start) * eased;
        distanceValue.textContent = current.toFixed(2);
        if (t < 1) requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }

    function animateParticle() {
      const points = routePolyline.getAttribute('points').split(' ');
      const [x0, y0] = points[0].split(',').map(Number);
      const [x1, y1] = points[1].split(',').map(Number);
      const [x2, y2] = points[2].split(',').map(Number);
      const startTime = performance.now();
      const duration = 2800;

      function tick(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * x1 + t * t * x2;
        const y = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * y1 + t * t * y2;
        routeParticle.style.left = x + 'px';
        routeParticle.style.top = y + 'px';
        if (t < 1) requestAnimationFrame(tick);
      }

      routeParticle.classList.add('visible');
      requestAnimationFrame(tick);
    }

    function revealPage2() {
      page1.classList.remove('active');
      page2.classList.add('active');

      setTimeout(() => {
        chinaMarker.classList.add('visible');
        chinaCity.classList.add('visible');
      }, 2000);

      setTimeout(() => {
        ukMarker.classList.add('visible');
        ukCity.classList.add('visible');
      }, 4000);

      setTimeout(() => {
        document.getElementById('routeLine').classList.add('visible');
        animateParticle();
      }, 6000);

      setTimeout(() => {
        distanceBox.classList.add('show');
        animateDistance(9222.28);
      }, 8400);
    }

    canvas.addEventListener('click', () => {
      if (transitionLocked) return;
      transitionLocked = true;
      isRotating = false;

      const startZ = camera.position.z;
      const endZ = 1.8;
      const startY = camera.position.y;
      const endY = 0.1;
      let t = 0;

      function zoom() {
        t += 0.05;
        const e = 1 - Math.pow(1 - t, 4);
        camera.position.z = startZ + (endZ - startZ) * e;
        camera.position.y = startY + (endY - startY) * e;
        if (t < 1) requestAnimationFrame(zoom);
        else revealPage2();
      }

      zoom();
    });

    // ========== Animation Loop ==========
    function animate() {
      requestAnimationFrame(animate);

      curRotX += (targetRotX - curRotX) * 0.08;
      curRotY += (targetRotY - curRotY) * 0.08;

      if (isRotating) {
        earth.rotation.y += 0.0005;
      } else {
        earth.rotation.x = curRotX;
        earth.rotation.y += 0.0002;
      }

      atmos1.rotation.copy(earth.rotation);
      atmos2.rotation.copy(earth.rotation);
      glow.rotation.copy(earth.rotation);

      updateMarkers();
      renderer.render(scene, camera);
    }

    // ========== Initialization ==========
    setTimeout(() => {
      loading.classList.remove('show');
    }, 600);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
