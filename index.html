<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Distance</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-1: #02070f;
      --bg-2: #06182c;
      --bg-3: #0b1f35;
      --text: #edf8ff;
      --soft: rgba(218, 230, 255, 0.7);
      --glow: rgba(120, 198, 255, 0.9);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(31, 78, 140, 0.12), transparent 28%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2) 35%, var(--bg-3));
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: .04em;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 16%, rgba(255,255,255,.9) 0 1px, transparent 2px),
        radial-gradient(circle at 24% 72%, rgba(255,255,255,.75) 0 1.1px, transparent 2.2px),
        radial-gradient(circle at 44% 30%, rgba(255,255,255,.82) 0 0.9px, transparent 1.8px),
        radial-gradient(circle at 66% 18%, rgba(255,255,255,.78) 0 1px, transparent 2px),
        radial-gradient(circle at 82% 56%, rgba(255,255,255,.82) 0 1.1px, transparent 2.2px),
        radial-gradient(circle at 92% 38%, rgba(255,255,255,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 78%, rgba(255,255,255,.72) 0 1px, transparent 2px),
        radial-gradient(circle at 48% 82%, rgba(255,255,255,.78) 0 1px, transparent 2px);
      opacity: .82;
      filter: blur(0.2px);
      z-index: 1;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 0;
    }

    .page {
      position: absolute;
      inset: 0;
      display: none;
      pointer-events: none;
      z-index: 5;
    }

    .page.active {
      display: block;
      pointer-events: auto;
    }

    .page-1 {
      display: block;
    }

    .click-hint {
      position: absolute;
      left: 50%;
      bottom: 8%;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(218, 232, 255, 0.44);
      user-select: none;
      animation: pulse 3s ease-in-out infinite;
    }

    .marker {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.3);
      pointer-events: none;
      transition: opacity .9s ease, transform .9s ease;
    }

    .marker.visible {
      opacity: 1;
      transform: scale(1);
    }

    .marker.china {
      background: #8de8ff;
      box-shadow: 0 0 0 2px rgba(141, 232, 255, 0.18), 0 0 26px rgba(141, 232, 255, 0.9), 0 0 50px rgba(141, 232, 255, 0.5);
    }

    .marker.uk {
      background: #e1ebff;
      box-shadow: 0 0 0 2px rgba(225, 235, 255, 0.18), 0 0 26px rgba(225, 235, 255, 0.85), 0 0 50px rgba(200, 220, 255, 0.5);
    }

    .city {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transform: translateY(14px) scale(.94);
      transition: opacity 1s ease, transform 1s ease, filter 1s ease;
      filter: blur(10px);
      text-transform: uppercase;
      pointer-events: none;
    }

    .city.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }

    .city .name {
      font-size: clamp(0.72rem, 1vw, 1.2rem);
      letter-spacing: 0.22em;
      font-weight: 600;
      text-shadow: 0 0 18px rgba(140,208,255,0.8);
    }

    .city .country {
      font-size: clamp(0.52rem, 0.8vw, 0.84rem);
      letter-spacing: 0.26em;
      color: rgba(210, 223, 255, 0.7);
    }

    .route-line {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity .8s ease;
    }

    .route-line.visible {
      opacity: 1;
    }

    .route-line polyline {
      fill: none;
      stroke: rgba(125, 208, 255, 0.7);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      filter: drop-shadow(0 0 8px rgba(125, 208, 255, 0.8));
      transition: stroke-dashoffset 2.8s ease;
    }

    .route-line.visible polyline {
      stroke-dashoffset: 0;
    }

    .route-particle {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(180, 233, 255, 1);
      box-shadow: 0 0 18px rgba(180, 233, 255, 1), 0 0 34px rgba(180, 233, 255, 0.8);
      opacity: 0;
      pointer-events: none;
      z-index: 12;
      transform: translate(-50%, -50%);
    }

    .route-particle.visible {
      opacity: 1;
    }

    .distance-box {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%) translateY(26px);
      opacity: 0;
      transition: opacity .8s ease, transform .8s ease;
      text-align: center;
      pointer-events: none;
      z-index: 16;
    }

    .distance-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .distance-box .label {
      font-size: clamp(0.72rem, 1vw, 1rem);
      letter-spacing: 0.18em;
      color: rgba(224, 234, 255, 0.8);
    }

    .distance-box .value {
      margin-top: .5rem;
      font-size: clamp(2.2rem, 3vw, 3.8rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #edf6ff;
      text-shadow: 0 0 32px rgba(160, 220, 255, 0.6);
      line-height: 1;
    }

    .distance-box .unit {
      margin-top: .3rem;
      font-size: clamp(0.68rem, 0.7vw, 0.9rem);
      letter-spacing: 0.14em;
      color: rgba(212, 224, 255, 0.72);
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.32; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.8; transform: translateX(-50%) scale(1.03); }
    }

    @media (max-width: 720px) {
      .click-hint { letter-spacing: 0.3em; }
      .city .name { letter-spacing: 0.14em; }
      .city .country { letter-spacing: 0.18em; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="page page-1 active" id="page1">
    <div class="click-hint">Click the Earth</div>
  </div>

  <div class="page page-2" id="page2">
    <div class="marker china" id="chinaMarker"></div>
    <div class="marker uk" id="ukMarker"></div>

    <div class="city" id="chinaCity">
      <div class="name">Hangzhou</div>
      <div class="country">China</div>
    </div>

    <div class="city" id="ukCity">
      <div class="name">Reading</div>
      <div class="country">United Kingdom</div>
    </div>

    <svg class="route-line" id="routeSvg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet">
      <polyline id="routeLine" points="180,420 500,320 820,260"></polyline>
    </svg>

    <div class="route-particle" id="routeParticle"></div>

    <div class="distance-box" id="distanceBox">
      <div class="label">我们的距离:</div>
      <div class="value" id="distanceValue">0</div>
      <div class="unit">公里</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 2000);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);

    camera.position.set(0, 0, 3.2);

    const ambient = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambient);

    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(1.8, 1.2, 2.2);
    scene.add(dir);

    const earthCanvas = document.createElement('canvas');
    earthCanvas.width = 2048;
    earthCanvas.height = 1024;
    const ctx = earthCanvas.getContext('2d');

    const ocean = ctx.createLinearGradient(0, 0, 0, earthCanvas.height);
    ocean.addColorStop(0, '#0a3b6a');
    ocean.addColorStop(0.35, '#0c456f');
    ocean.addColorStop(0.7, '#082f4d');
    ocean.addColorStop(1, '#061b30');
    ctx.fillStyle = ocean;
    ctx.fillRect(0, 0, earthCanvas.width, earthCanvas.height);

    function addLandBlob(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y + h * 0.2);
      for (let i = 0; i < 12; i++) {
        const px = x + (i / 11) * w + (Math.random() - 0.5) * 25;
        const py = y + (Math.random() - 0.2) * h;
        ctx.lineTo(px, py);
      }
      ctx.bezierCurveTo(x + w * 0.75, y + h * 0.9, x + w * 0.55, y + h * 1.1, x + w * 0.1, y + h * 0.96);
      ctx.closePath();
      ctx.fill();
    }

    const landColors = ['#2f6d43', '#3d7e4f', '#5f7d3a', '#8b6a40', '#5d4a2f'];
    addLandBlob(520, 200, 430, 180, landColors[0]);
    addLandBlob(950, 250, 320, 160, landColors[1]);
    addLandBlob(1150, 420, 260, 240, landColors[2]);
    addLandBlob(840, 510, 210, 220, landColors[3]);
    addLandBlob(700, 180, 150, 120, landColors[4]);
    addLandBlob(1550, 250, 240, 170, landColors[1]);
    addLandBlob(1450, 600, 220, 120, landColors[3]);

    for (let i = 0; i < 1000; i++) {
      const x = Math.random() * earthCanvas.width;
      const y = Math.random() * earthCanvas.height;
      const alpha = Math.random() * 0.2 + 0.05;
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.fillRect(x, y, 2, 2);
    }

    const texture = new THREE.CanvasTexture(earthCanvas);
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;

    const earthGeo = new THREE.SphereGeometry(1.18, 256, 256);
    const earthMat = new THREE.MeshPhongMaterial({
      map: texture,
      shininess: 8,
      emissive: 0x0d1d2d,
      emissiveIntensity: 0.12,
    });

    const earth = new THREE.Mesh(earthGeo, earthMat);
    earth.rotation.y = -0.8;
    scene.add(earth);

    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.22, 128, 128),
      new THREE.MeshBasicMaterial({
        color: 0x8fd7ff,
        transparent: true,
        opacity: 0.16,
        side: THREE.BackSide,
      })
    );
    scene.add(atmosphere);

    const outerGlow = new THREE.Mesh(
      new THREE.SphereGeometry(1.32, 128, 128),
      new THREE.MeshBasicMaterial({
        color: 0x7bc7ff,
        transparent: true,
        opacity: 0.08,
        side: THREE.BackSide,
      })
    );
    scene.add(outerGlow);

    const HANGZHOU = { lat: 30.2741, lon: 120.1551 };
    const READING = { lat: 51.4545, lon: -0.9796 };

    function latLonToVec3(lat, lon, radius = 1.18) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      return new THREE.Vector3(x, y, z);
    }

    function vec3ToScreen(v) {
      const p = v.clone().project(camera);
      return {
        x: (p.x * window.innerWidth) / 2 + window.innerWidth / 2,
        y: -(p.y * window.innerHeight) / 2 + window.innerHeight / 2,
      };
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    const chinaMarker = document.getElementById('chinaMarker');
    const ukMarker = document.getElementById('ukMarker');
    const chinaCity = document.getElementById('chinaCity');
    const ukCity = document.getElementById('ukCity');
    const routeLine = document.getElementById('routeLine');
    const routeParticle = document.getElementById('routeParticle');
    const distanceBox = document.getElementById('distanceBox');
    const distanceValue = document.getElementById('distanceValue');
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');

    let transitionLocked = false;
    let isRotating = true;
    let targetRotX = 0;
    let targetRotY = 0;
    let curRotX = 0;
    let curRotY = 0;

    document.addEventListener('pointermove', (e) => {
      if (transitionLocked) return;
      const x = (e.clientX / window.innerWidth) * 2 - 1;
      const y = (e.clientY / window.innerHeight) * 2 - 1;
      targetRotY = -x * 0.28;
      targetRotX = y * 0.18;
    });

    function updateMarkers() {
      const china = latLonToVec3(HANGZHOU.lat, HANGZHOU.lon).applyQuaternion(earth.quaternion);
      const uk = latLonToVec3(READING.lat, READING.lon).applyQuaternion(earth.quaternion);
      const c = vec3ToScreen(china);
      const u = vec3ToScreen(uk);

      chinaMarker.style.left = c.x + 'px';
      chinaMarker.style.top = c.y + 'px';
      chinaMarker.style.transform = 'translate(-50%, -50%)';

      ukMarker.style.left = u.x + 'px';
      ukMarker.style.top = u.y + 'px';
      ukMarker.style.transform = 'translate(-50%, -50%)';

      chinaCity.style.left = c.x - 56 + 'px';
      chinaCity.style.top = c.y + 50 + 'px';

      ukCity.style.left = u.x + 60 + 'px';
      ukCity.style.top = u.y - 62 + 'px';

      routeLine.setAttribute('points', `${c.x},${c.y} ${window.innerWidth / 2},${window.innerHeight / 2 - 30} ${u.x},${u.y}`);
    }

    function animateDistance(value) {
      const start = 0;
      const startTime = performance.now();
      const duration = 2400;

      function tick(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        const current = start + (value - start) * eased;
        distanceValue.textContent = current.toFixed(2);
        if (t < 1) requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }

    function animateParticle() {
      const points = routeLine.getAttribute('points').split(' ');
      const start = points[0].split(',').map(Number);
      const mid = points[1].split(',').map(Number);
      const end = points[2].split(',').map(Number);
      const startTime = performance.now();
      const duration = 2600;

      function tick(now) {
        const t = Math.min((now - startTime) / duration, 1);
        const x = (1 - t) * (1 - t) * start[0] + 2 * (1 - t) * t * mid[0] + t * t * end[0];
        const y = (1 - t) * (1 - t) * start[1] + 2 * (1 - t) * t * mid[1] + t * t * end[1];
        routeParticle.style.left = x + 'px';
        routeParticle.style.top = y + 'px';
        routeParticle.classList.add('visible');
        if (t < 1) requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    }

    function revealPage2() {
      page1.classList.remove('active');
      page2.classList.add('active');

      setTimeout(() => {
        chinaMarker.classList.add('visible');
        chinaCity.classList.add('visible');
      }, 1200);

      setTimeout(() => {
        ukMarker.classList.add('visible');
        ukCity.classList.add('visible');
      }, 2800);

      setTimeout(() => {
        document.getElementById('routeSvg').classList.add('visible');
        animateParticle();
      }, 4800);

      setTimeout(() => {
        distanceBox.classList.add('show');
        animateDistance(9222.28);
      }, 6600);
    }

    canvas.addEventListener('click', () => {
      if (transitionLocked) return;
      transitionLocked = true;
      isRotating = false;

      const startZ = camera.position.z;
      const endZ = 1.7;
      const startY = camera.position.y;
      const endY = 0.15;
      let t = 0;

      function zoom() {
        t += 0.04;
        const e = 1 - Math.pow(1 - t, 4);
        camera.position.z = startZ + (endZ - startZ) * e;
        camera.position.y = startY + (endY - startY) * e;
        if (t < 1) requestAnimationFrame(zoom);
        else revealPage2();
      }

      zoom();
    });

    function animate() {
      requestAnimationFrame(animate);

      curRotX += (targetRotX - curRotX) * 0.08;
      curRotY += (targetRotY - curRotY) * 0.08;

      if (isRotating) {
        earth.rotation.y += 0.0008;
      } else {
        earth.rotation.x = curRotX;
        earth.rotation.y += 0.00045;
      }

      outerGlow.rotation.copy(earth.rotation);
      atmosphere.rotation.copy(earth.rotation);

      updateMarkers();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
